<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    input, textarea, button { font: inherit; padding: .6rem; box-sizing: border-box; }
    input, textarea { display: block; width: 100%; margin: .5rem 0 1rem; }
    textarea { min-height: 120px; resize: vertical; }
    button { cursor: pointer; margin-right: .4rem; }
    article { border-top: 1px solid #ccc; padding: 1rem 0; }
    article p { white-space: pre-wrap; overflow-wrap: anywhere; }
    #message { min-height: 1.5em; color: #a22; }
  </style>
</head>
<body>
  <h1>게시판</h1>
  <form id="form">
    <label for="title">제목</label><input id="title" maxlength="200" required>
    <label for="content">내용</label><textarea id="content" required></textarea>
    <button type="submit">저장</button><button type="button" id="cancel" hidden>수정 취소</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <h2>게시글 목록</h2><div id="posts"></div>
  <script src="app.js"></script>
</body>
</html>
