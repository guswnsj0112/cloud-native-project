name: Build and push Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-board-build
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: guswnsj0112/cloud-board-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: guswnsj0112/cloud-board-frontend:${{ github.sha }}

      - name: Update Kubernetes image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$IMAGE_TAG" ]; then
            echo "main has changed since this build started; skipping deployment update."
            exit 0
          fi

          sed -i -E "s|(image: guswnsj0112/cloud-board-backend:).*|\1${IMAGE_TAG}|" k8s/board.yaml
          sed -i -E "s|(image: guswnsj0112/cloud-board-frontend:).*|\1${IMAGE_TAG}|" k8s/board.yaml

          grep -Fq "image: guswnsj0112/cloud-board-backend:${IMAGE_TAG}" k8s/board.yaml
          grep -Fq "image: guswnsj0112/cloud-board-frontend:${IMAGE_TAG}" k8s/board.yaml

          if git diff --quiet -- k8s/board.yaml; then
            echo "Image tags are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/board.yaml
          git commit -m "Update board images to ${IMAGE_TAG}"
          git push origin HEAD:main
