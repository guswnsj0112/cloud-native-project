apiVersion: v1
kind: PersistentVolume
metadata:
  name: board-h2-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/cloud-board/h2
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - myserver02

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: board-h2-pvc
  namespace: board
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: board-h2-pv
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: board
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: myserver02
      containers:
        - name: backend
          image: guswnsj0112/cloud-board-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: board-data
              mountPath: /app/data
      volumes:
        - name: board-data
          persistentVolumeClaim:
            claimName: board-h2-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: board
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: guswnsj0112/cloud-board-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: board
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
